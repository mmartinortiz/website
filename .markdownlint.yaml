# markdownlint configuration
# https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

# Default state for all rules
default: true

# MD009/no-trailing-spaces - Trailing spaces
MD009:
  br_spaces: 2
  strict: false

# MD012/no-multiple-blanks - Multiple consecutive blank lines
MD012: false

# MD013/line-length - Disabled (Hugo content often has long lines in frontmatter)
MD013: false

# MD025/single-title - Multiple top-level headings
# Disabled because Hugo frontmatter title counts as h1
MD025: false

# MD033/no-inline-html - Inline HTML
MD033:
  allowed_elements:
    - br
    - sup
    - sub
    - kbd
    - details
    - summary
    - figure
    - figcaption
    - img
    - video
    - source
    - iframe

# MD036/no-emphasis-as-heading - Emphasis used instead of heading
# Disabled - common pattern for labeling code blocks
MD036: false

# MD040/fenced-code-language - Code blocks should have language
# Disabled - not all code blocks need language specifier
MD040: false

# MD041/first-line-heading - First line in file should be a heading
MD041: false

# MD024/no-duplicate-heading - Multiple headings with the same content
MD024:
  siblings_only: true

# MD026/no-trailing-punctuation - Trailing punctuation in heading
MD026:
  punctuation: ".,;:!"

# MD046/code-block-style - Code block style
MD046:
  style: fenced

# MD007/ul-indent - Unordered list indentation
MD007:
  indent: 2
